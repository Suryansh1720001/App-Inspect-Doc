<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AppInspect">
  <title>AppInspect</title>

  <!-- Light-theme wordmark companion. Same geometry as favicon.svg, but the
       lens centre is transparent instead of filled white, so the mark sits
       cleanly on any surface (page, panel, footer) rather than only on white. -->

  <!-- Handle -->
  <rect x="44" y="44" width="8" height="22" rx="4" transform="rotate(-45 48 55)" fill="#0e1a19"/>

  <!-- Lens ring: stroked, so the centre stays see-through -->
  <circle cx="26" cy="26" r="19" fill="none" stroke="#0e1a19" stroke-width="6"/>

  <!-- Bug -->
  <ellipse cx="26" cy="28" rx="8" ry="10" fill="#0e1a19"/>
  <circle cx="26" cy="18" r="4.5" fill="#0e1a19"/>
  <line x1="26" y1="19" x2="26" y2="37" stroke="#ffffff" stroke-width="1.8"/>
</svg>
