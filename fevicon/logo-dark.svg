<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AppInspect">
  <title>AppInspect</title>

  <!-- Dark-theme variant of logo.svg. The ink is the brand teal rather than a
       plain inversion, so it reads as a designed reverse lockup and matches the
       accent already used for links and the version pill. The lens centre is
       transparent, so this works on every dark surface in the site. -->

  <!-- Handle -->
  <rect x="44" y="44" width="8" height="22" rx="4" transform="rotate(-45 48 55)" fill="#4fd1c5"/>

  <!-- Lens ring -->
  <circle cx="26" cy="26" r="19" fill="none" stroke="#4fd1c5" stroke-width="6"/>

  <!-- Bug -->
  <ellipse cx="26" cy="28" rx="8" ry="10" fill="#4fd1c5"/>
  <circle cx="26" cy="18" r="4.5" fill="#4fd1c5"/>
  <line x1="26" y1="19" x2="26" y2="37" stroke="#08201e" stroke-width="1.8"/>
</svg>
