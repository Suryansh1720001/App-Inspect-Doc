<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Debug inspector favicon">
  <title>Debug Inspector</title>

  <!-- Handle -->
  <rect x="44" y="44" width="8" height="22" rx="4" transform="rotate(-45 48 55)" fill="#000"/>

  <!-- Ring -->
  <circle cx="26" cy="26" r="22" fill="#000"/>
  <circle cx="26" cy="26" r="16" fill="#fff"/>

  <!-- Bug body (bold, simple) -->
  <ellipse cx="26" cy="28" rx="8" ry="10" fill="#000"/>
  <!-- Bug head -->
  <circle cx="26" cy="18" r="4.5" fill="#000"/>
  <!-- Stripe -->
  <line x1="26" y1="19" x2="26" y2="37" stroke="#fff" stroke-width="1.8"/>
</svg>
